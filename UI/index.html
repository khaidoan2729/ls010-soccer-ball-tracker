<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LS-010 Capstone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>LS-010 Capstone</h1>
    <button class="settings">Settings</button>
  </header>
  <div id="FootageContainer">
    <!-- Live MJPEG from ballcore; app.js falls back to Soccer.jpg when opened without the server -->
    <img src="/stream" alt="Live camera" id="Footage">
    <canvas id="Overlay"></canvas>
    <div class="vid-label" id="StatusLabel">Connecting…</div>

    <div id="RecordingControls" aria-label="Recording controls">
      <button class="rec-btn record" id="RecordBtn" title="Record">o</button>
      <button class="rec-btn stop" id="StopBtn" title="Stop">[]</button>
    </div>

    <input type="checkbox" id="AnalyticsToggle">
    <div id="AnalyticsPanel">
      <label for="AnalyticsToggle" id="AnalyticsTab">&lt;</label>
      <div class="analytic"><span>Ball speed</span><span id="Speed">–</span></div>
      <div class="analytic"><span>Ball elevation</span><span id="Height">–</span></div>
      <div class="analytic"><span>Current zone</span><span id="Zone">–</span></div>
      <div class="analytic"><span>Time in zone</span><span id="ZoneTime">–</span></div>
      <div class="analytic"><span>Confidence</span><span id="Confidence">–</span></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
